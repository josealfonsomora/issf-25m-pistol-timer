<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Timer Pistola Estándar Orden Exacto</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; transition: background-color 0.5s, color 0.5s;}
  #timer { font-size: 96px; font-weight: bold; margin-bottom: 20px; }
  #phase { font-size: 32px; font-weight: bold; margin-bottom: 10px; }
  #order { font-size: 48px; font-weight: bold; margin-bottom: 30px; min-height: 70px; }
  #nextPhaseSection { font-size: 28px; color: orange; margin-bottom: 30px; }
  button { font-size: 24px; padding: 10px 20px; margin: 10px 10px 0 10px; cursor: pointer; }
  body.carguen { background-color: #b30000; color: white; }
  body.tiempo { background-color: #004d00; color: white; }
</style>
</head>
<body class="carguen">

<div id="phase">Preparado para iniciar</div>
<div id="timer">00:00</div>
<div id="order">--</div>
<div id="nextPhaseSection">Siguiente ronda: --</div>

<div id="buttons">
  <button id="startPauseBtn" onclick="startPauseTimer()">Iniciar</button>
  <button onclick="nextPhase()">Siguiente ronda</button>
  <button onclick="resetTimer()">Reiniciar</button>
</div>

<script>
// Construcción del orden pedido: fases carguen y tiro alternadas
const phases = [
  {name: "Carguen", type:"carguen", duration:40},
  {name: "Ronda A - 1", type:"tiro", duration:150},
  {name: "Carguen", type:"carguen", duration:40},
  {name: "Ronda A - 2", type:"tiro", duration:150},
  {name: "Carguen", type:"carguen", duration:40},
  {name: "Ronda A - 3", type:"tiro", duration:150},
  {name: "Carguen", type:"carguen", duration:40},
  {name: "Ronda A - 4", type:"tiro", duration:150},
  {name: "Carguen", type:"carguen", duration:40},

  {name: "Ronda B - 1", type:"tiro", duration:20},
  {name: "Carguen", type:"carguen", duration:40},
  {name: "Ronda B - 2", type:"tiro", duration:20},
  {name: "Carguen", type:"carguen", duration:40},
  {name: "Ronda B - 3", type:"tiro", duration:20},
  {name: "Carguen", type:"carguen", duration:40},
  {name: "Ronda B - 4", type:"tiro", duration:20},
  {name: "Carguen", type:"carguen", duration:40},

  {name: "Ronda C - 1", type:"tiro", duration:10},
  {name: "Carguen", type:"carguen", duration:40},
  {name: "Ronda C - 2", type:"tiro", duration:10},
  {name: "Carguen", type:"carguen", duration:40},
  {name: "Ronda C - 3", type:"tiro", duration:10},
  {name: "Carguen", type:"carguen", duration:40},
  {name: "Ronda C - 4", type:"tiro", duration:10},
  {name: "Carguen", type:"carguen", duration:40},
];

let currentPhaseIndex = 0;
let timeLeft = 0;
let interval = null;
let isPaused = false;

const phaseEl = document.getElementById("phase");
const timerEl = document.getElementById("timer");
const orderEl = document.getElementById("order");
const nextPhaseEl = document.getElementById("nextPhaseSection");
const startPauseBtn = document.getElementById("startPauseBtn");

function setBodyClass() {
  if(phases[currentPhaseIndex].type === "carguen") {
    document.body.className = "carguen";
  } else {
    document.body.className = "tiempo";
  }
}

function updateDisplay() {
  phaseEl.textContent = phases[currentPhaseIndex].name;
  timeLeft = timeLeft === 0 ? phases[currentPhaseIndex].duration : timeLeft;

  if(phases[currentPhaseIndex].type === "carguen") {
    orderEl.textContent = "Carguen";
  } else { // tipo tiro
    orderEl.textContent = `Tiempo de tiro: ${formatTime(timeLeft)}`;
  }

  // Siguiente ronda o etapa
  if(currentPhaseIndex +1 < phases.length) {
    let nextPhase = phases[currentPhaseIndex + 1];
    let nextText = (nextPhase.type === "carguen") ? "Carguen" : nextPhase.name;
    nextPhaseEl.textContent = `Siguiente ronda: ${nextText}`;
  } else {
    nextPhaseEl.textContent = "Siguiente ronda: --";
  }

  timerEl.textContent = formatTime(timeLeft);
  setBodyClass();
}

function formatTime(seconds) {
  let min = Math.floor(seconds/60);
  let sec = seconds%60;
  return (min<10?"0"+min:min) + ":" + (sec<10?"0"+sec:sec);
}

function tick() {
  if(timeLeft > 0) {
    timeLeft--;
    updateDisplay();
    if(phases[currentPhaseIndex].type === "tiro" && timeLeft <= 5) {
      playTickSound();
    }
  } else {
    nextPhase();
  }
}

function startPauseTimer() {
  if(interval === null) {
    if(currentPhaseIndex >= phases.length) {
      resetTimer();
    }
    if(timeLeft === 0) {
      timeLeft = phases[currentPhaseIndex].duration;
    }
    interval = setInterval(tick, 1000);
    isPaused = false;
    startPauseBtn.textContent = "Pausa";
    updateDisplay();
  } else {
    togglePause();
  }
}

function togglePause() {
  if(isPaused) {
    interval = setInterval(tick, 1000);
    isPaused = false;
    startPauseBtn.textContent = "Pausa";
  } else {
    clearInterval(interval);
    interval = null;
    isPaused = true;
    startPauseBtn.textContent = "Continuar";
  }
}

// Función para avanzar según estado del botón "Siguiente ronda"
function nextPhase() {
  if(interval) {
    clearInterval(interval);
    interval=null;
  }

  // Si estamos en fase TIRO, siguiente fase será CARGUEN mismo índice o siguiente ronda
  if(phases[currentPhaseIndex].type === "tiro") {
    if(currentPhaseIndex + 1 < phases.length) {
      currentPhaseIndex++;
      timeLeft = phases[currentPhaseIndex].duration;
    }
  } else {
    // Si estamos en CARGUEN, saltamos a siguiente fase (de tiro)
    // Asumimos que siempre después de CARGUEN viene fase tiro salvo final
    if(currentPhaseIndex + 1 < phases.length) {
      currentPhaseIndex++;
      timeLeft = phases[currentPhaseIndex].duration;
    }
  }
  isPaused = true;
  startPauseBtn.textContent = "Iniciar";
  updateDisplay();
}

function resetTimer() {
  if(interval) {
    clearInterval(interval);
    interval = null;
  }
  currentPhaseIndex = 0;
  timeLeft = phases[0].duration;
  isPaused = true;
  startPauseBtn.textContent = "Iniciar";
  updateDisplay();
}

// Sonidos
const tickSound = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");

function playTickSound() {
  tickSound.currentTime = 0;
  tickSound.play();
}

resetTimer();
</script>

</body>
</html>
