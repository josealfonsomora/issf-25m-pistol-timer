<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Timer Pistola Estándar Órdenes Simplificadas</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; transition: background-color 0.5s, color 0.5s; }
  #timer { font-size: 96px; font-weight: bold; margin-bottom: 20px; }
  #phase { font-size: 32px; font-weight: bold; margin-bottom: 10px; }
  #order { font-size: 48px; font-weight: bold; margin-bottom: 30px; min-height: 70px; }
  #nextPhaseSection { font-size: 28px; color: orange; margin-bottom: 30px; }
  button { font-size: 24px; padding: 10px 20px; margin: 10px 10px 0 10px; cursor: pointer; }
  body.carguen, body.descarguen { background-color: #b30000; color: white; }
  body.tiempo { background-color: #004d00; color: white; }
  #buttons { margin-top: 20px; }
</style>
</head>
<body class="descarguen">

<div id="phase">Preparado para iniciar</div>
<div id="timer">00:00</div>
<div id="order">--</div>
<div id="nextPhaseSection">Siguiente ronda: --</div>

<div id="buttons">
  <button id="startPauseBtn" onclick="startPauseTimer()">Iniciar</button>
  <button onclick="nextRound()">Siguiente ronda</button>
  <button onclick="resetTimer()">Reiniciar</button>
</div>

<script>
// Definición de fases, nombrando solo fases carguen, tiros y descarguen
// Cada ronda consta de tres subfases consecutivas.
const rounds = [
  {name: "Ronda 1", shootTime:150},
  {name: "Ronda 2", shootTime:150},
  {name: "Ronda 3", shootTime:150},
  {name: "Ronda 4", shootTime:150},

  {name: "Ronda 5", shootTime:20},
  {name: "Ronda 6", shootTime:20},
  {name: "Ronda 7", shootTime:20},
  {name: "Ronda 8", shootTime:20},

  {name: "Ronda 9", shootTime:10},
  {name: "Ronda 10", shootTime:10},
  {name: "Ronda 11", shootTime:10}
];

const carguenDuration = 40; // segundos
const descarguenDuration = 20;

let currentRoundIndex = 0;
let subPhase = "carguen"; // carguen, tiro, descarguen
let timeLeft = 0;
let interval = null;
let isPaused = false;

const phaseEl = document.getElementById("phase");
const timerEl = document.getElementById("timer");
const orderEl = document.getElementById("order");
const nextPhaseEl = document.getElementById("nextPhaseSection");
const startPauseBtn = document.getElementById("startPauseBtn");

function setBodyClass() {
  if(subPhase === "carguen" || subPhase === "descarguen") {
    document.body.className = 'carguen';
  } else if(subPhase === "tiro") {
    document.body.className = 'tiempo';
  }
}

function updateDisplay() {
  let roundName = rounds[currentRoundIndex] ? rounds[currentRoundIndex].name : "--";
  let shootTime = rounds[currentRoundIndex] ? rounds[currentRoundIndex].shootTime : 0;

  switch(subPhase) {
    case "carguen":
      phaseEl.textContent = roundName;
      orderEl.textContent = "Carguen";
      break;
    case "tiro":
      phaseEl.textContent = roundName;
      orderEl.textContent = `Tiempo de tiro: ${formatTime(shootTime)}`;
      break;
    case "descarguen":
      phaseEl.textContent = roundName;
      orderEl.textContent = "Descarguen";
      break;
  }

  // Siguiente ronda (solo nombre de la ronda siguiente)
  if(currentRoundIndex + 1 < rounds.length) {
    nextPhaseEl.textContent = "Siguiente ronda: " + rounds[currentRoundIndex + 1].name;
  } else {
    nextPhaseEl.textContent = "Siguiente ronda: --";
  }

  timerEl.textContent = formatTime(timeLeft);
  setBodyClass();
}

function formatTime(seconds) {
  let min = Math.floor(seconds/60);
  let sec = seconds % 60;
  return (min<10 ? "0"+min : min) + ":" + (sec<10 ? "0"+sec : sec);
}

function tick() {
  if(timeLeft > 0) {
    timeLeft--;
    updateDisplay();

    if(timeLeft <= 5 && subPhase === "tiro") {
      playTickSound();
    }
  }
  if(timeLeft === 0) {
    nextSubPhase();
  }
}

function nextSubPhase() {
  switch(subPhase) {
    case "carguen":
      subPhase = "tiro";
      timeLeft = rounds[currentRoundIndex].shootTime;
      playStartShootSound();
      break;
    case "tiro":
      subPhase = "descarguen";
      timeLeft = descarguenDuration;
      playStopSound();
      break;
    case "descarguen":
      currentRoundIndex++;
      if(currentRoundIndex >= rounds.length) {
        stopTimer();
        phaseEl.textContent = "Entrenamiento completado";
        orderEl.textContent = "--";
        nextPhaseEl.textContent = "--";
        startPauseBtn.textContent = "Reiniciar";
        return;
      }
      subPhase = "carguen";
      timeLeft = carguenDuration;
      playLoadSound();
      break;
  }
  updateDisplay();
}

function startPauseTimer() {
  if(interval === null) {
    if(currentRoundIndex >= rounds.length) {
      resetTimer();
    }
    if(timeLeft === 0) {
      subPhase = "carguen";
      timeLeft = carguenDuration;
      playLoadSound();
    }
    interval = setInterval(tick, 1000);
    isPaused = false;
    startPauseBtn.textContent = "Pausa";
    updateDisplay();
  } else {
    togglePause();
  }
}

function togglePause() {
  if(isPaused) {
    interval = setInterval(tick, 1000);
    isPaused = false;
    startPauseBtn.textContent = "Pausa";
  } else {
    clearInterval(interval);
    interval = null;
    isPaused = true;
    startPauseBtn.textContent = "Continuar";
  }
}

function nextRound() {
  if(interval !== null) {
    clearInterval(interval);
    interval = null;
  }
  currentRoundIndex++;
  if(currentRoundIndex >= rounds.length) {
    currentRoundIndex = rounds.length - 1;
  }
  subPhase = "carguen";
  timeLeft = carguenDuration;
  isPaused = true;
  startPauseBtn.textContent = "Iniciar";
  updateDisplay();
}

function resetTimer() {
  if(interval !== null) {
    clearInterval(interval);
    interval = null;
  }
  currentRoundIndex = 0;
  subPhase = "carguen";
  timeLeft = carguenDuration;
  isPaused = true;
  startPauseBtn.textContent = "Iniciar";
  updateDisplay();
}

// Sonidos
const tickSound = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
const loadSound = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
const stopSound = new Audio("https://actions.google.com/sounds/v1/alarms/warning_alarm.ogg");
const shootStartSound = new Audio("https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg");

function playTickSound() {
  tickSound.currentTime = 0;
  tickSound.play();
}

function playLoadSound() {
  loadSound.currentTime = 0;
  loadSound.play();
}

function playStopSound() {
  stopSound.currentTime = 0;
  stopSound.play();
}

function playStartShootSound() {
  shootStartSound.currentTime = 0;
  shootStartSound.play();
}

resetTimer();
</script>

</body>
</html>
