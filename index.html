<script>
// Secuencia de fases
const phases = [
  {name: "Carguen", type:"carguen", duration:60},
  {name: "Ronda A - 1", type:"tiro", duration:150},
  {name: "Carguen", type:"carguen", duration:60},
  {name: "Ronda A - 2", type:"tiro", duration:150},
  {name: "Carguen", type:"carguen", duration:60},
  {name: "Ronda A - 3", type:"tiro", duration:150},
  {name: "Carguen", type:"carguen", duration:60},
  {name: "Ronda A - 4", type:"tiro", duration:150},
  {name: "Carguen", type:"carguen", duration:60},

  {name: "Ronda B - 1", type:"tiro", duration:20},
  {name: "Carguen", type:"carguen", duration:60},
  {name: "Ronda B - 2", type:"tiro", duration:20},
  {name: "Carguen", type:"carguen", duration:60},
  {name: "Ronda B - 3", type:"tiro", duration:20},
  {name: "Carguen", type:"carguen", duration:60},
  {name: "Ronda B - 4", type:"tiro", duration:20},
  {name: "Carguen", type:"carguen", duration:60},

  {name: "Ronda C - 1", type:"tiro", duration:10},
  {name: "Carguen", type:"carguen", duration:60},
  {name: "Ronda C - 2", type:"tiro", duration:10},
  {name: "Carguen", type:"carguen", duration:60},
  {name: "Ronda C - 3", type:"tiro", duration:10},
  {name: "Carguen", type:"carguen", duration:60},
  {name: "Ronda C - 4", type:"tiro", duration:10},
  {name: "Descarguen", type:"descarguen", duration:0}
];

let currentPhaseIndex = 0;
let timeLeft = phases[0].duration;
let interval = null;
let isPaused = true;

const phaseEl = document.getElementById("phase");
const timerEl = document.getElementById("timer");
const orderEl = document.getElementById("order");
const nextPhaseEl = document.getElementById("nextPhaseSection");
const startPauseBtn = document.getElementById("startPauseBtn");

const beepSound = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");

function playBeep() {
  try { beepSound.currentTime = 0; beepSound.play(); } catch(e) {}
}

function setBodyClassForPhase() {
  document.body.classList.remove("carguen","tiempo","neutral");
  const t = phases[currentPhaseIndex].type;
  if(t === "carguen") document.body.classList.add("carguen");
  else if(t === "tiro") document.body.classList.add("tiempo");
  else document.body.classList.add("neutral");
}

function formatTime(seconds) {
  let min = Math.floor(seconds / 60);
  let sec = seconds % 60;
  return (min < 10 ? "0"+min : min) + ":" + (sec < 10 ? "0"+sec : sec);
}

function updateDisplay() {
  phaseEl.textContent = phases[currentPhaseIndex].name;
  if(phases[currentPhaseIndex].type === "tiro") orderEl.textContent = "🔫";
  else if(phases[currentPhaseIndex].type === "carguen") orderEl.textContent = "Carguen";
  else orderEl.textContent = "Descarguen";

  if(currentPhaseIndex + 1 < phases.length){
    const nextPhase = phases[currentPhaseIndex + 1];
    nextPhaseEl.textContent = `Siguiente ronda: ${nextPhase.type === "carguen" ? "Carguen" : nextPhase.name}`;
    nextPhaseEl.style.color = "orange";
  } else {
    nextPhaseEl.textContent = "Siguiente ronda: --";
    nextPhaseEl.style.color = "orange";
  }

  timerEl.textContent = (phases[currentPhaseIndex].type === "descarguen") ? "" : formatTime(timeLeft);

  setBodyClassForPhase();
}

function flashOnce() {
  document.body.classList.add("flash");
  setTimeout(()=>document.body.classList.remove("flash"), 1000); // dura 1 segundo
}

function tick() {
  if(phases[currentPhaseIndex].type === "descarguen") {
    stopTimer();
    updateDisplay();
    return;
  }

  if(timeLeft > 0) {
    timeLeft--;

    // Si estamos en carguen y quedan exactamente 5s, hacer flash
    if(phases[currentPhaseIndex].type === "carguen" && timeLeft === 5) {
      flashOnce();
      playBeep();
    } else if(timeLeft <= 5) {
      playBeep(); // pitidos finales de otras fases también
    }

    updateDisplay();
  }

  if(timeLeft === 0){
    if(currentPhaseIndex + 1 < phases.length){
      currentPhaseIndex++;
      if(phases[currentPhaseIndex].type === "descarguen") {
        timeLeft = 0;
        updateDisplay();
        stopTimer();
      } else {
        timeLeft = phases[currentPhaseIndex].duration;
        updateDisplay();
      }
    } else {
      stopTimer();
      updateDisplay();
    }
  }
}

function startPauseTimer(){
  if(interval === null){
    interval = setInterval(tick,1000);
    isPaused = false;
    startPauseBtn.textContent = "Pausa";
    updateDisplay();
  } else {
    togglePause();
  }
}

function togglePause(){
  if(isPaused){
    interval = setInterval(tick, 1000);
    isPaused = false;
    startPauseBtn.textContent = "Pausa";
  } else {
    clearInterval(interval);
    interval = null;
    isPaused = true;
    startPauseBtn.textContent = "Continuar";
  }
}

function nextPhase(){
  if(interval) { clearInterval(interval); interval=null; }
  if(currentPhaseIndex + 1 < phases.length){
    currentPhaseIndex++;
    timeLeft = phases[currentPhaseIndex].duration;
    isPaused = true;
    startPauseBtn.textContent = "Iniciar";
    updateDisplay();
  }
}

function resetTimer(){
  if(interval){ clearInterval(interval); interval=null; }
  currentPhaseIndex = 0;
  timeLeft = phases[0].duration;
  isPaused = true;
  startPauseBtn.textContent = "Iniciar";
  updateDisplay();
}

function stopTimer(){
  if(interval){ clearInterval(interval); interval=null; }
  isPaused = true;
  startPauseBtn.textContent = "Iniciar";
}

updateDisplay();
</script>
